<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOVA CONTROL — MESH MAP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --hud-bg: #0a0e14;
      --hud-cyan: #00ffc8;
      --hud-amber: #ffcc00;
      --hud-red: #ff3344;
      --hud-blue: #0088ff;
      --hud-green: #00ff66;
      --hud-dim: #1a2030;
      --hud-text: #c8d0e0;
      --hud-text-dim: #4a5568;
      --hud-font: 'Share Tech Mono', 'Courier New', monospace;
      --hud-font-title: 'Orbitron', 'Share Tech Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      background: var(--hud-bg);
      color: var(--hud-text);
      font-family: var(--hud-font);
    }
    body {
      background-image:
        radial-gradient(circle at 20% 0%, rgba(0,136,255,0.06), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(0,255,200,0.05), transparent 45%);
    }

    /* ---- Top bar ---- */
    #topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
      padding: 14px 24px;
      background: linear-gradient(180deg, rgba(10,14,20,0.97) 0%, rgba(10,14,20,0.85) 100%);
      border-bottom: 1px solid rgba(0,255,200,0.12);
      backdrop-filter: blur(6px);
    }
    #title {
      font-family: var(--hud-font-title);
      font-size: clamp(16px, 1.8vw, 26px);
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--hud-cyan);
      text-shadow: 0 0 20px rgba(0,255,200,0.4), 0 0 60px rgba(0,255,200,0.15);
    }
    #summary {
      display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
      font-size: 13px; letter-spacing: 0.05em;
    }
    .sum-item { display: flex; flex-direction: column; line-height: 1.3; }
    .sum-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--hud-text-dim); }
    .sum-value { font-family: var(--hud-font-title); font-size: 18px; color: var(--hud-cyan); }
    .sum-value.up { color: var(--hud-green); }
    .sum-value.down { color: var(--hud-red); }
    #updated { font-size: 11px; color: var(--hud-text-dim); }

    /* ---- Grid of node cards ---- */
    #mesh-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      padding: 22px 24px 60px;
    }

    .node-card {
      position: relative;
      background: linear-gradient(160deg, rgba(26,32,48,0.55) 0%, rgba(10,14,20,0.6) 100%);
      border: 1px solid rgba(0,255,200,0.14);
      border-radius: 10px;
      padding: 16px 16px 14px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .node-card.up    { border-color: rgba(0,255,102,0.30); }
    .node-card.down  { border-color: rgba(255,51,68,0.40); box-shadow: 0 0 22px rgba(255,51,68,0.10); }
    .node-card.suspect, .node-card.unknown { border-color: rgba(255,204,0,0.35); }

    .node-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; background: var(--hud-text-dim); }
    .dot.up { background: var(--hud-green); box-shadow: 0 0 8px var(--hud-green); }
    .dot.down { background: var(--hud-red); box-shadow: 0 0 8px var(--hud-red); animation: pulse 1.4s infinite; }
    .dot.suspect, .dot.unknown { background: var(--hud-amber); box-shadow: 0 0 8px var(--hud-amber); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .node-name {
      font-family: var(--hud-font-title); font-weight: 700;
      font-size: 16px; letter-spacing: 0.08em; color: var(--hud-text);
    }
    .node-ip { font-size: 12px; color: var(--hud-blue); margin-left: auto; letter-spacing: 0.05em; }
    .node-meta { font-size: 11px; color: var(--hud-text-dim); margin: 2px 0 12px; letter-spacing: 0.04em; }

    /* ---- Bars ---- */
    .bars { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .bar-row { display: grid; grid-template-columns: 46px 1fr 48px; align-items: center; gap: 8px; }
    .bar-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--hud-text-dim); }
    .bar-track { height: 7px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; background: var(--hud-cyan); }
    .bar-fill.warn { background: var(--hud-amber); }
    .bar-fill.crit { background: var(--hud-red); }
    .bar-val { font-size: 11px; text-align: right; color: var(--hud-text); }

    /* ---- Service chips ---- */
    .svc-header {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--hud-text-dim); margin-bottom: 8px;
      border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; letter-spacing: 0.03em;
      padding: 4px 9px; border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .chip .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--hud-text-dim); }
    .chip.up { border-color: rgba(0,255,102,0.40); color: #b8ffd0; }
    .chip.up .cdot { background: var(--hud-green); box-shadow: 0 0 6px var(--hud-green); }
    .chip.down { border-color: rgba(255,51,68,0.40); color: #ffc2c8; }
    .chip.down .cdot { background: var(--hud-red); box-shadow: 0 0 6px var(--hud-red); }
    .chip.unknown, .chip.suspect { border-color: rgba(255,204,0,0.35); color: #ffe8a0; }
    .chip.unknown .cdot, .chip.suspect .cdot { background: var(--hud-amber); }
    .chip .port { color: var(--hud-text-dim); font-size: 10px; }
    .chip .clusterbadge {
      font-size: 8px; text-transform: uppercase; letter-spacing: 0.06em;
      padding: 1px 5px; border-radius: 8px;
      background: rgba(0,136,255,0.18); color: var(--hud-blue);
      border: 1px solid rgba(0,136,255,0.4);
    }
    .empty-svc { font-size: 11px; color: var(--hud-text-dim); font-style: italic; }
    #error-banner {
      display: none; margin: 18px 24px 0; padding: 10px 14px;
      border: 1px solid rgba(255,51,68,0.4); border-radius: 8px;
      background: rgba(255,51,68,0.08); color: #ffc2c8; font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="title">NOVA MESH MAP</div>
    <div id="summary">
      <div class="sum-item"><span class="sum-label">Nodes</span><span class="sum-value" id="sum-nodes">--</span></div>
      <div class="sum-item"><span class="sum-label">Services</span><span class="sum-value" id="sum-services">--</span></div>
      <div class="sum-item"><span class="sum-label">Up</span><span class="sum-value up" id="sum-up">--</span></div>
      <div class="sum-item"><span class="sum-label">Down</span><span class="sum-value down" id="sum-down">--</span></div>
      <div id="updated">last updated --</div>
    </div>
  </div>

  <div id="error-banner"></div>
  <div id="mesh-grid"></div>

  <script>
    const KNOWN_ORDER = ['mac-studio', 'nova-core', 'nuk', 'mac-mini', 'tv-movies-mini'];

    function barClass(pct) {
      if (pct == null) return '';
      if (pct >= 90) return 'crit';
      if (pct >= 70) return 'warn';
      return '';
    }

    function loadPct(node) {
      if (node.load_avg_1m == null || !node.cpu_cores) return null;
      return Math.min(100, Math.round((node.load_avg_1m / node.cpu_cores) * 100));
    }

    function fmtPct(v) { return v == null ? '--' : Math.round(v) + '%'; }

    function bar(label, pct) {
      const p = pct == null ? 0 : Math.max(0, Math.min(100, pct));
      return `
        <div class="bar-row">
          <span class="bar-label">${label}</span>
          <div class="bar-track"><div class="bar-fill ${barClass(pct)}" style="width:${p}%"></div></div>
          <span class="bar-val">${fmtPct(pct)}</span>
        </div>`;
    }

    function chip(svc) {
      const st = (svc.status || 'unknown').toLowerCase();
      const cls = ['up','down'].includes(st) ? st : 'unknown';
      const cluster = svc.clustered ? `<span class="clusterbadge">A/A</span>` : '';
      return `<span class="chip ${cls}" title="${svc.service_name} @ ${svc.host}:${svc.port} (${svc.status})">
        <span class="cdot"></span>${svc.service_name}<span class="port">:${svc.port}</span>${cluster}</span>`;
    }

    function nodeCard(node) {
      const st = (node.status || 'unknown').toLowerCase();
      const lp = loadPct(node);
      const svcs = node.services || [];
      const chips = svcs.length
        ? svcs.map(chip).join('')
        : `<span class="empty-svc">no registered services</span>`;
      const hbAge = node.heartbeat_age_s != null ? `hb ${Math.round(node.heartbeat_age_s)}s ago` : 'no heartbeat';
      const upN = svcs.filter(s => (s.status||'').toLowerCase()==='up').length;
      return `
        <div class="node-card ${st}">
          <div class="node-head">
            <span class="dot ${st}"></span>
            <span class="node-name">${node.node_name}</span>
            <span class="node-ip">${node.node_ip || ''}</span>
          </div>
          <div class="node-meta">
            ${node.cpu_cores || '?'} cores · ${node.ram_gb || '?'} GB · ${node.status} · ${hbAge}
          </div>
          <div class="bars">
            ${bar('Load', lp)}
            ${bar('Mem', node.memory_percent)}
            ${bar('Disk', node.disk_percent)}
          </div>
          <div class="svc-header">Services (${upN}/${svcs.length} up)</div>
          <div class="chips">${chips}</div>
        </div>`;
    }

    function orderNodes(nodes) {
      return nodes.slice().sort((a, b) => {
        const ia = KNOWN_ORDER.indexOf(a.node_name);
        const ib = KNOWN_ORDER.indexOf(b.node_name);
        const ra = ia === -1 ? 999 : ia;
        const rb = ib === -1 ? 999 : ib;
        if (ra !== rb) return ra - rb;
        return a.node_name.localeCompare(b.node_name);
      });
    }

    async function refresh() {
      const banner = document.getElementById('error-banner');
      try {
        const r = await fetch('/api/mesh', { cache: 'no-store' });
        const data = await r.json();
        if (data.error) {
          banner.style.display = 'block';
          banner.textContent = 'Mesh data error: ' + data.error;
        } else {
          banner.style.display = 'none';
        }
        const nodes = orderNodes(data.nodes || []);
        document.getElementById('mesh-grid').innerHTML = nodes.map(nodeCard).join('');

        const s = data.summary || {};
        document.getElementById('sum-nodes').textContent = s.node_count ?? nodes.length;
        document.getElementById('sum-services').textContent = s.service_count ?? '--';
        document.getElementById('sum-up').textContent = s.services_up ?? '--';
        document.getElementById('sum-down').textContent = s.services_down ?? '--';
        const t = data.generated_at ? new Date(data.generated_at) : new Date();
        document.getElementById('updated').textContent = 'last updated ' + t.toLocaleTimeString();
      } catch (e) {
        banner.style.display = 'block';
        banner.textContent = 'Failed to fetch /api/mesh: ' + e;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
  <script src="/nav-bar.js"></script>
</body>
</html>
