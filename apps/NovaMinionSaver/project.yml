name: NovaMinionSaver
options:
  bundleIdPrefix: com.jordankoch
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"

targets:
  NovaMinion:
    type: bundle
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovaMinion
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: NovaMinion
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.NovaMinion
        WRAPPER_EXTENSION: saver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NovaMinionView
        INFOPLIST_KEY_CFBundleDisplayName: "Nova Minion"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Jordan Koch. All rights reserved."
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        INSTALL_PATH: "$(HOME)/Library/Screen Savers"
        SKIP_INSTALL: YES
        DEAD_CODE_STRIPPING: YES
