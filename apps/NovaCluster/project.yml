name: NovaCluster
options:
  bundleIdPrefix: net.digitalnoise
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"

targets:
  NovaClusterPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NovaCluster
        excludes:
          - "**/.DS_Store"
      # Constellation core shared with the Nova Minion screensaver.
      - path: ../Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: NovaCluster/Info.plist
      properties:
        CFBundleDisplayName: Nova Cluster
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: "Nova Cluster shows what Nova's machines are doing with their language models, from Nova's hub on your network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: net.digitalnoise.NovaCluster
            CFBundleURLSchemes:
              - novacluster
    settings:
      base:
        PRODUCT_NAME: NovaCluster
        PRODUCT_BUNDLE_IDENTIFIER: net.digitalnoise.NovaClusterPad
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: QRRCB8HB3W
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
    scheme: {}

  # Native macOS window onto the same cluster map — shares every source in NovaCluster/.
  NovaClusterMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NovaCluster
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "Assets.xcassets"
      - path: NovaClusterMac
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
      # Constellation core shared with the Nova Minion screensaver.
      - path: ../Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: NovaClusterMac/Info.plist
      properties:
        CFBundleDisplayName: Nova Cluster
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSLocalNetworkUsageDescription: "Nova Cluster shows what Nova's machines are doing with their language models, from Nova's hub on your network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: net.digitalnoise.NovaCluster
            CFBundleURLSchemes:
              - novacluster
    settings:
      base:
        PRODUCT_NAME: "Nova Cluster"
        PRODUCT_BUNDLE_IDENTIFIER: net.digitalnoise.NovaCluster
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: QRRCB8HB3W
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets:
        - NovaClusterTests

  # Logic + layout tests. Not hosted in the app (no window, no live hub, no real UserDefaults/Keychain):
  # the sources under test are compiled straight into the bundle.
  NovaClusterTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: NovaCluster/Cluster.swift
      - path: NovaCluster/ClusterConfig.swift
      - path: NovaCluster/NodeLines.swift
      - path: NovaCluster/Palette.swift
      - path: NovaCluster/ConstellationFleet.swift
      - path: NovaCluster/NodeFacts.swift
      - path: NovaClusterMac/MenuBarHealth.swift
      - path: ../Shared/NovaConstellationCore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.digitalnoise.NovaClusterTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QRRCB8HB3W
