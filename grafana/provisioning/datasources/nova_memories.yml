apiVersion: 1
datasources:
  - name: nova_memories
    type: grafana-postgresql-datasource
    uid: nova-memories-pg
    access: proxy
    url: pg-primary.digitalnoise.net:5434
    user: grafana_ro
    database: nova_memories
    isDefault: false
    jsonData:
      database: nova_memories
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
