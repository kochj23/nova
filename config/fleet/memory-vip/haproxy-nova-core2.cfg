global
    log /dev/log local0
    maxconn 8192
    stats socket /run/haproxy/admin.sock mode 660 level admin
defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    retries 3

# ---- F5-like stats dashboard ----
frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-node

# ---- TinyChat: least-conn, health-checked across all copies ----
frontend tinychat_fe
    bind *:8100
    default_backend tinychat_be
backend tinychat_be
    balance leastconn
    option httpchk GET /
    server nova-core   192.168.1.2:8000  check
    server mac-studio  192.168.1.6:8000  check
    server nuk         192.168.1.10:8000 check
    server nova-core2  192.168.1.86:8000 check

# ---- SearXNG: least-conn, health-checked ----
frontend searxng_fe
    bind *:8180
    default_backend searxng_be
backend searxng_be
    balance leastconn
    option httpchk GET /
    server nuk         192.168.1.10:8080 check
    server nova-core2  192.168.1.86:8080 check

# ---- Nova memory server HA (SPOF plan Phase 4, 2026-10-04) ----
# Writes (POST /remember, DELETE /forget*) go ONLY to the Studio (.6), the truth source (Jordan Q1=A).
# Reads spread: .6 weight 100, replicas .2 and .5 weight 50; a dead .6 keeps recall alive.
frontend memory_fe
    bind *:18790
    acl is_write method POST DELETE
    acl is_read_post path_beg /recall_batch
    use_backend memory_write_be if is_write !is_read_post
    default_backend memory_read_be
backend memory_write_be
    option httpchk GET /health
    server mac-studio  192.168.1.6:18790 check inter 5s fall 2 rise 2
backend memory_read_be
    balance leastconn
    option httpchk GET /health
    server mac-studio  192.168.1.6:18790 check inter 5s fall 2 rise 2 weight 100
    server nova-core   192.168.1.2:18790 check inter 5s fall 2 rise 2 weight 50
    server nova-core3  192.168.1.5:18790 check inter 5s fall 2 rise 2 weight 50
