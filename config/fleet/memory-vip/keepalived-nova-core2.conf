# memory-server.digitalnoise.net front-door VIP (queue #3575, 2026-10-21).
# VIP 192.168.1.240 floats between nova-core2 .86 (pri 150, preferred) and nova-core5 .10 (pri 100).
# Both run HAProxy memory_fe on *:18790 (configs must stay identical). Unicast VRRP, no multicast.
global_defs {
    router_id nova-core2
    script_user root
    enable_script_security
    vrrp_garp_master_refresh 60
}
vrrp_script chk_memory_front {
    script "/etc/keepalived/chk_memory_front.sh"
    interval 2
    timeout 3
    fall 2
    rise 2
}
vrrp_instance MEMORY_FRONT {
    state BACKUP
    interface eno1
    virtual_router_id 240
    priority 150
    advert_int 1
    preempt_delay 30
    unicast_src_ip 192.168.1.86
    unicast_peer {
        192.168.1.10
    }
    virtual_ipaddress {
        192.168.1.240/24 dev eno1 label eno1:mem
    }
    track_script {
        chk_memory_front
    }
}
