  # Task-failure sentinel (2026-08-06) — watches the scheduler's OWN tasks. Every other
  # monitor watches a layer (host/service/device/feed); nothing watched whether each of
  # the ~150 scheduled jobs actually ran and exited 0, so tasks failed 100% invisibly
