    args: ["--fix"]
    # Hourly, not daily: a miss found at 03:00 can still be repaired before anyone reads it.
    # Every job it covers carries a >=30min grace, so a run mid-generation stays quiet.
    schedule: every 1h
    timeout: 5400
    overlap: skip

