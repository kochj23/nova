# nova_scheduler.yaml — Unified task scheduler for Nova
# One persistent daemon replaces 30+ fragile launchd StartInterval/Calendar jobs.
#
# Schedule types:
#   every: "5m", "4h", "30s"         — interval-based
#   cron:  "0 23 * * *"              — standard 5-field cron (min hr day mon dow)
#
# Overlap:
#   skip  — if already running, skip this cycle (default)
#   queue — wait for current to finish, then run once
#
# Written by Jordan Koch.

scheduler:
  tick_interval: 1
  max_concurrent: 6
  status_port: 37460
  heartbeat_interval: 3600
  stale_threshold: 2.0
  python: /opt/homebrew/bin/python3
  shell: /bin/zsh
  tz: America/Los_Angeles

slack:
  channel: C0ATAF7NZG9
  alerts: true
  heartbeat: true
  startup: true

tasks:

  # ── Every 5 minutes ─────────────────────────────────────────────────────

  protect_monitor:
    script: nova_protect_monitor.py
    schedule: every 2m
    timeout: 120
    overlap: skip

  app_watchdog:
    script: nova_app_watchdog.py
    schedule: every 5m
    timeout: 60
    overlap: skip

  prober:                          # synthetic end-to-end probes (real HTTP/memory/embed/PG)
    script: nova_prober.py
    schedule: every 2m
    args: ["--once", "--quiet"]
    timeout: 202
    overlap: skip

  incident_lifecycle:              # auto-close resolved incidents + recurrence detection
    script: nova_incident_lifecycle.py
    schedule: every 10m
    args: ["--sweep"]
    timeout: 120
    overlap: skip

  awn_air_quality:                 # Ambient AQIN indoor air quality (PM2.5/PM10/CO2) via AWN cloud
    script: nova_awn_poller.py
