  watchtower:                        # watch EVERYTHING on the network: device liveness (learned-baseline, wired-only, active-ping-confirmed) + per-FEED dead-man's-switch (climate/hue/weather/air/mesh/ha_sensors) + scene-aware (smart-home judged by hue reachable/feeds, not presence). Root-cause-collapses a down coordinator into its stale feeds. Alert-on-change to #nova-alerts; records net_liveness time-series for the weekly Network-Health report. Built after the 2026-07-17 PoE Zigbee coordinator wedge sat dark 14 days unnoticed (pinged fine, feed dead). Distinct from nova_network_sentinel.py (NMAP/IDS).
    script: nova_watchtower.py
