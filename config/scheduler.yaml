# nova_scheduler.yaml — Unified task scheduler for Nova
# One persistent daemon replaces 30+ fragile launchd StartInterval/Calendar jobs.
#
# Schedule types:
#   every: "5m", "4h", "30s"         — interval-based
#   cron:  "0 23 * * *"              — standard 5-field cron (min hr day mon dow)
#
# Overlap:
#   skip  — if already running, skip this cycle (default)
#   queue — wait for current to finish, then run once
#
# Written by Jordan Koch.

scheduler:
  tick_interval: 1
  max_concurrent: 6
  status_port: 37460
  heartbeat_interval: 3600
  stale_threshold: 2.0
  python: /opt/homebrew/bin/python3
  shell: /bin/zsh
  tz: America/Los_Angeles

slack:
  channel: C0ATAF7NZG9
  alerts: true
  heartbeat: true
  startup: true

tasks:

  house_facts:                     # six-month build #1 — device firmware/IP/room/port ledger (needs local Mosquitto + HA Keychain token)
    script: nova_house_facts.py
    schedule: every 15m
    timeout: 120
    overlap: skip
  live_docs:                       # six-month build #6 — regenerate workspace IDENTITY/SOUL/USER.md with live values
    script: nova_live_docs.py
    args: ["--write-workspace"]
    schedule: every 1h
    timeout: 60
    overlap: skip
  # ── Every 5 minutes ─────────────────────────────────────────────────────

  protect_monitor:
    script: nova_protect_monitor.py
    schedule: every 2m
    timeout: 120
    overlap: skip

  app_watchdog:
    script: nova_app_watchdog.py
    # re-enabled on .6 2026-07-29: macOS-only task (open -a restarts, local :11434/374xx
    # checks) — was wrongly offloaded to .2 scheduler-core in Wave A (2026-07-14), where
    # no local Ollama exists -> week of flapping "App Watchdog Alert (host studio)" incidents.
    schedule: every 5m
    timeout: 60
    overlap: skip

  prober:                          # synthetic end-to-end probes (real HTTP/memory/embed/PG)
