  # credential to .2 every 4h — well ahead of the ~12h token lifetime. See nova_claude_cred_sync.
  # 1Password vault 'Nova' is where humans create/rotate secrets; the fleet reads nova.secrets.
  # Mirror hourly so the fleet keeps working when the WAN or 1Password is down. 2026-10-03.
  # Jordan 2026-10-03: every article written to the journal gets a 'Nova Speaks' video for his approval.
