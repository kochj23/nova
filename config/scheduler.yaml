  rando_daily_ops:                       # THE daily operations report — "Day in the Life of My Infrastructure", covers everything done today (30 sources) in Nova's sassy voice -> /operations
    script: nova_rando_daily_ops.py
    enabled: true  # re-enabled on .6 2026-07-30 (was orphaned: disabled here, never landed on .2). Runs here reliably — journal repo + OpenRouter key + git creds all present. .2 migration deferred until those exist there.
    schedule: cron 10 17 * * *  # 5:10pm daily (moved from 6pm 2026-07-30 per Little Mister; +10min offset so it pushes AFTER daily_digest's 17:00 journal push — that git-push race was the exit=1 failures)
    timeout: 900
    overlap: skip
    group: llm

  # Weekly infrastructure report -> /operations/ every Thursday 4pm (7-day lens:
  # changes, crashes, alerts, memory growth, fleet health). Same voice as the daily log.
  # NOTE: this scheduler's dow uses Python weekday() (Mon=0..Sun=6), NOT standard cron —
  # so 3 = Thursday (verified via next_cron_time). Don't "fix" to 4 (that's Friday).










  strix_rotation:                  # daily rotating purple-team pentest; auto-kills, findings -> #nova-info
    enabled: true                  # re-enabled 2026-07-11: wrapper hardened (always force-kills sandbox, try/finally, os._exit) + local ollama/qwen3:8b
    script: nova_strix_rotation.py
    schedule: cron 30 2 * * *      # 02:30 daily (after the 02:00 PG backup)
    timeout: 4200                  # 70m ceiling; the wrapper self-caps runs at 45m/20m
    overlap: skip


  # Meshtastic node tracking (2026-07-29) — runs on .6, NOT nova-core: the
  # collector reaches the mesh bridge via mDNS (jordans-mac-mini.local),
  # which resolves natively on macOS.
  mesh_churn_collect:
    script: nova_mesh_churn_report.py
    schedule: every 30m
    args: ["--collect"]
    timeout: 60
    overlap: skip

  mesh_churn_report:
    script: nova_mesh_churn_report.py
    schedule: cron 18 7 * * *
    args: ["--report"]
    timeout: 60
    overlap: skip

  # Purple-team detection validation (2026-07-30) — runs on .6 where the syslog
  # server listens. Fires synthetic attack signatures in a maintenance window and
  # scores whether the SIEM detects them. A miss pages; all-caught is FYI.
  purple_team:
    script: nova_purple_team.py
    schedule: cron 0 13 * * 3   # weekly, Wed 1pm
    args: ["--run"]
    timeout: 400
    overlap: skip

  ha_metrics:                        # moved from scheduler-core 2026-09-26 (needs Keychain HA token)
    script: nova_ha_metrics.py
    args: ["--once"]
    schedule: every 5m
    timeout: 120
    overlap: skip

  llm_ping:                          # 2026-09-26 Jordan: real one-token pings to every LLM node -> ranking the gateway routes by
    script: nova_llm_ping.py
    schedule: every 5m
    timeout: 120
    overlap: skip

  dashboard_look:                  # Nova reads her own Grafana dashboards with a local vision model (2026-10-01)
    script: nova_dashboard_look.py
    schedule: every 2h
    timeout: 1500
    overlap: skip
    group: llm
