    # re-enabled on .6 2026-07-29: macOS-only task (open -a restarts, local :11434/374xx
    # checks) — was wrongly offloaded to .2 scheduler-core in Wave A (2026-07-14), where
    # no local Ollama exists -> week of flapping "App Watchdog Alert (host studio)" incidents.
    schedule: every 5m
    timeout: 60
    overlap: skip

  prober:                          # synthetic end-to-end probes (real HTTP/memory/embed/PG)
