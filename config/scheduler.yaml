    enabled: false                     # UNAS-primary cutover 2026-09-10 — forward direction retired
    script: nova_nas_localdiff.py
    schedule: cron 0 5 * * *
    timeout: 5400
    overlap: skip

  nas_manifest_sync:                   # #656 §7 — FAST manifest-diff Synology->UNAS backup. DISABLED 2026-09-10 at UNAS-primary cutover: forward direction (Synology now replica). Hard anti-wipe guards (empty/short source, 5%/500 orphan cap). LIVE 2026-08-04 -> retired 2026-09-10.
    enabled: false                     # UNAS-primary cutover 2026-09-10 — forward direction retired
    script: nova_nas_manifest_sync.py
    args: []
    schedule: cron 30 5 * * *
    timeout: 5400
    overlap: skip

  nas_localdiff_reverse:               # UNAS-primary cutover 2026-09-10: REVERSE mirror UNAS->Synology, keeps the Synology a current warm replica now that it's the secondary. Self-defers (aborts cheaply, no writes/scan) while the Synology RAID resyncs, then activates automatically once resync completes. Additive; deletes stay OFF (no --allow-deletes) until we've watched several clean rounds post-resync.
    enabled: true
    script: nova_nas_localdiff_reverse.py
    args: ["--apply"]
    schedule: cron 0 5 * * *
    timeout: 12150
    overlap: skip



