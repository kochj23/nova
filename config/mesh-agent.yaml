    port: 5432
    host: 127.0.0.1
  - name: redis
    port: 6379
    host: 127.0.0.1
  - name: ollama
    port: 11434
    host: 127.0.0.1
    health_url: "/api/version"
  - name: memory_server
    port: 18790
    host: 127.0.0.1
    health_url: "/health"
  - name: gateway
    port: 18792
    host: 127.0.0.1
    health_url: "/health"
  - name: scheduler
    port: 37460
    host: 127.0.0.1
    health_url: "/status"
  - name: big_brother
    port: 37461
    host: 127.0.0.1
    health_url: "/bb/status"
  - name: novacontrol_web
    port: 37450
    host: 127.0.0.1
  - name: syslog
    port: 37462
    host: 127.0.0.1
    health_url: "/health"
  - name: snmp_poller
    port: 37463
    host: 127.0.0.1
