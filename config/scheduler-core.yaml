  # compromised appliance phoning home (Weeping Angel pattern). DNS source: BIND
  # querylog on this resolver (.2) via journald, per-client IP->domain. Read-only;
  # learns baseline in nova_ops.iot_egress_baseline (3-day per-device warmup),
  # only suspicious new domains (odd TLD / dynamic-DNS-tunnel / raw-IP) are routed
  # to triage (source=iot_egress); benign CDN churn is recorded, not paged.
  iot_egress_watch:
