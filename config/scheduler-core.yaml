  # suspicion-carrying anomalies to triage (source=iot_egress). Learning mode
  # for the first NOVA_IOT_LEARN_DAYS (3) per device -- new devices baseline,
  # not alarm.
  iot_egress_watch:
    script: nova_iot_egress_watch.py
    schedule: every 45m
    timeout: 180
    overlap: skip

