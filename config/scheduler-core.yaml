# scheduler-core.yaml — Nova SECOND scheduler instance (nova-scheduler-core on nova-core / .2)
#
# Offload Phase 2: this instance runs ONLY the curated set of PORTABLE,
# non-LLM, non-macOS, non-/Volumes tasks that can reach PG/Redis/services on
# 192.168.1.6 (and other network hosts) over the LAN. The .6 scheduler keeps
# every macOS / LLM / gpu_heavy / /Volumes-bound singleton task.
#
# Each task below is DISABLED on the .6 scheduler.yaml once verified here, so
# exactly one node owns each task. Fully reversible: re-enable on .6, disable
# here.
#
# Written by Jordan Koch.

scheduler:
  tick_interval: 1
  max_concurrent: 4
  status_port: 37464          # distinct from .6 scheduler (37460) and .2 snmp (37463)
  heartbeat_interval: 3600
  stale_threshold: 2.0
  python: /home/kochj/.openclaw/venv/bin/python   # Linux venv, NOT homebrew
  shell: /bin/bash
  tz: America/Los_Angeles
  env:
    # ~/.local/bin first: nova-core3's Claude Code CLI is the per-user native install there; without
    # it every article job on a core3-led scheduler died "[Errno 2] ... 'claude'" (2026-10-18/19).
    # (env is read at start-up, not on SIGHUP — effective at the next leader start/failover.)
    PATH: /home/kochj/.local/bin:/usr/local/bin:/usr/bin:/bin
    PYTHONPATH: /home/kochj/.openclaw/scripts

slack:
  channel: C0ATAF7NZG9
  alerts: true
  heartbeat: true
  startup: true

tasks:

  # ── Pure PG / network telemetry collectors (portable) ───────────────────

  # Hourly analytics rollup. Already pointed at PG .6; only HTTP HEAD probes
  # to public sites + PG writes. No macOS/local-hardware coupling.
  analytics_aggregate:
    script: nova_analytics_aggregate.py
    schedule: cron 5 * * * *
    timeout: 60
    overlap: skip

  # WAN ping/latency/speedtest. Measures the shared LAN's WAN uplink; runs
  # from any node on the network. Writes telemetry.wan_quality on PG .6.
  wan_monitor:
    script: nova_wan_monitor.py
    schedule: every 5m
    timeout: 180
    overlap: skip

  # PG streaming-replication health. Reads pg_stat_replication on the primary
  # (.6) over the network — the view is the same regardless of client node.
  replication_monitor:
    script: nova_replication_monitor.py
    schedule: every 1m
    timeout: 30
    overlap: skip

  # TLS cert expiry for network endpoints (UDM/UNAS/Protect/Synology + public
  # Nova services). Pure ssl/openssl probing + PG. No local-host dependency.
  cert_monitor:
    script: nova_cert_monitor.py
    schedule: every 6h
    timeout: 120
    overlap: skip

  # Wazuh SIEM bridge. Wazuh indexer + PG + memory_server + Big Brother events
  # are all reachable over the LAN (Wazuh is in fact LOCAL to this node).
  # Behavior-equivalent to the .6 run; PG correlation/threat-score/annotations
  # are the observable output.
  wazuh_bridge:
    script: nova_wazuh_bridge.py
    schedule: every 2m
    timeout: 60
    overlap: skip

  # ── Redis maintenance (portable) ────────────────────────────────────────

  # Weekly dead-letter replay back into the ingest queue. Pure Redis (.6).
  dead_letter_replay:
    script: nova_dead_letter_replay.py
    schedule: cron 0 4 * * 0
    timeout: 300
    overlap: skip

  incident_lifecycle:              # migrated from .6 2026-07-14 (Wave A)
    script: nova_incident_lifecycle.py
    schedule: every 10m
    args: ["--sweep"]
    timeout: 120
    overlap: skip
  goal_check:                      # migrated from .6 2026-07-14 (Wave A)
    script: nova_goal_check.py
    schedule: every 30m
    timeout: 120
    overlap: skip
  protect_monitor:
