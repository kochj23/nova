# MLX round-robin load balancer — fronts the Mac MLX pool on :5050 (where nova-gateway's MLX_URL points).
# Members are the Mac minis running mlx_lm.server on a LOCAL model (launchd-visible, no /Volumes/Data).
upstream mlx_pool {
    server 192.168.1.190:5050 max_fails=2 fail_timeout=30s;   # M4 Pro, 64GB
    server 192.168.1.7:5050   max_fails=2 fail_timeout=30s;   # M2 Pro, 32GB — active (loaded 17b fine)
}
server {
    listen 5050;
    location / {
        proxy_pass http://mlx_pool;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
